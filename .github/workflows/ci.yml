# CI：格式 → vet → 构建 → 单元测试 → 集成测试（MySQL 服务容器）
#
# 集成测试覆盖三块：仓储层、后台写路径（handler）、路由级门禁（router）。
# 三者共用 GOCMS_TEST_DSN，测试内部会各自派生独立库（<库名>_writeflow / _router），
# 但基础库 gocms_test 必须先存在，由服务容器的 MYSQL_DATABASE 直接建好。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: gocms_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: gofmt 格式检查
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化："
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: 构建
        run: go build -o gocms ./cmd/gocms

      - name: 单元测试（无数据库环境也能全绿的部分）
        run: go test ./... -count=1

      - name: 集成测试（仓储 / 后台写路径 / 路由门禁）
        env:
          GOCMS_TEST_DSN: 'root:root@tcp(127.0.0.1:3306)/gocms_test?parseTime=true&charset=utf8mb4&loc=Local'
        run: go test ./internal/repository/ ./internal/handler/ ./internal/router/ -count=1
