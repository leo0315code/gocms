{{template "head" .}}

<div class="page-hero">
  <div class="container">
    {{template "breadcrumb" .}}
    <h1 class="page-title">标签：{{.Tag.Name}}</h1>
    <p class="page-desc">共 {{.Total}} 篇相关内容</p>
  </div>
</div>

<section class="section">
  <div class="container two-col">
    <div class="col-main">
      {{if .Posts}}
        <div class="post-list">
          {{range .Posts}}{{template "post-card" .}}{{end}}
        </div>
        {{template "pagination" .Pagination}}
      {{else}}
        <div class="empty-state"><h3>暂无内容</h3><p>该标签下还没有文章。</p></div>
      {{end}}
    </div>
    {{template "sidebar" .}}
  </div>
</section>

{{template "foot" .}}
