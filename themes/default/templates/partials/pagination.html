{{define "pagination"}}
{{if gt .TotalPages 1}}
<nav class="pagination" aria-label="分页">
  {{if .HasPrev}}<a class="page-btn" href="{{.PrevURL}}" rel="prev">上一页</a>{{else}}<span class="page-btn disabled">上一页</span>{{end}}
  {{range .Pages}}
    {{if .Current}}<span class="page-btn current">{{.Num}}</span>{{else}}<a class="page-btn" href="{{.URL}}">{{.Num}}</a>{{end}}
  {{end}}
  {{if .HasNext}}<a class="page-btn" href="{{.NextURL}}" rel="next">下一页</a>{{else}}<span class="page-btn disabled">下一页</span>{{end}}
  <span class="page-info">共 {{.Total}} 条 / {{.TotalPages}} 页</span>
</nav>
{{end}}
{{end}}
